name: Mobile graph space

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-graph-space.yml'
      - 'scripts/mobile-graph-space.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mobile-graph-space.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx components/ControlPanel.tsx index.css || true
          git diff --cached --quiet && exit 0
          git commit -m "ui(mobile): more graph space — hide legend/degree on phone, compact header"
          git push origin HEAD:main
